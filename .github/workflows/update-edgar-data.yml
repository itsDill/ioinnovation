name: Refresh EDGAR data

on:
  schedule:
    - cron: "35 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Refresh data and filer pages
        run: python scripts/fetch_edgar_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holdings-latest.json data/form4-latest.json data/btc-treasury-watchlist.json data/filers-index.json data/filers/*.json filers/*.html filers/index.html holdings/index.html
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore(data): refresh EDGAR 13F and Form 4 snapshots"
          git push
